<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuel route: {{ data.start.query }} to {{ data.finish.query }}</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #1a1a1a; }
  body { display: flex; flex-direction: column; }
  header { padding: 10px 16px; border-bottom: 1px solid #ddd; display: flex; flex-wrap: wrap; gap: 6px 24px; align-items: baseline; }
  header h1 { font-size: 16px; margin: 0; }
  header span b { font-variant-numeric: tabular-nums; }
  main { flex: 1; display: flex; min-height: 0; }
  #map { flex: 1; }
  aside { width: 320px; overflow-y: auto; border-left: 1px solid #ddd; padding: 8px 12px; }
  aside li { margin: 0 0 10px; list-style: none; }
  aside ol { padding: 0; margin: 0; }
  .n { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; background: #d9480f; color: #fff; font-weight: 600; margin-right: 6px; }
  .muted { color: #666; }
  .pin { width: 26px; height: 26px; line-height: 26px; border-radius: 50%; color: #fff; font-weight: 600; text-align: center; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  @media (max-width: 720px) { main { flex-direction: column; } aside { width: auto; max-height: 35%; border-left: 0; border-top: 1px solid #ddd; } }
</style>
</head>
<body>
<header>
  <h1>{{ data.start.query }} &rarr; {{ data.finish.query }}</h1>
  <span><b>{{ data.distance_miles }}</b> mi</span>
  <span><b>{{ data.total_gallons_purchased }}</b> gal bought</span>
  <span>Total fuel cost <b>${{ data.total_fuel_cost }}</b></span>
</header>
<main>
  <div id="map"></div>
  <aside>
    <ol id="stops"></ol>
  </aside>
</main>
{{ data|json_script:"route-data" }}
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
  const data = JSON.parse(document.getElementById("route-data").textContent);
  const map = L.map("map");
     L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18, attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  const latlngs = data.route.coordinates.map(c => [c[1], c[0]]);
  const line = L.polyline(latlngs, { color: "#1c7ed6", weight: 5, opacity: 0.85 }).addTo(map);
  map.fitBounds(line.getBounds(), { padding: [30, 30] });

  const pin = (text, color) => L.divIcon({
    className: "", iconSize: [26, 26], iconAnchor: [13, 13],
    html: `<div class="pin" style="background:${color}">${text}</div>`
  });
  L.marker([data.start.lat, data.start.lng], { icon: pin("A", "#2b8a3e") }).addTo(map).bindPopup("Start: " + data.start.label);
  L.marker([data.finish.lat, data.finish.lng], { icon: pin("B", "#c92a2a") }).addTo(map).bindPopup("Finish: " + data.finish.label);

  const list = document.getElementById("stops");
  if (!data.fuel_stops.length) {
    list.innerHTML = '<li class="muted">No fuel stop needed: the trip fits in the starting tank.</li>';
  }
  data.fuel_stops.forEach((s, i) => {
    const html = `<b>${s.name}</b><br>${s.city}, ${s.state} &middot; mile ${s.route_mile}<br>` +
      `$${s.price_per_gallon.toFixed(3)}/gal &middot; buy ${s.gallons_purchased} gal = <b>$${s.cost.toFixed(2)}</b>`;
    L.marker([s.lat, s.lng], { icon: pin(i + 1, "#d9480f") }).addTo(map).bindPopup(html);
    const li = document.createElement("li");
    li.innerHTML = `<span class="n">${i + 1}</span>${html}`;
    list.appendChild(li);
  });
</script>
</body>
</html>
